name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install
      - name: Build (gera também o routeTree)
        run: bun run build
      - name: Verificar routeTree.gen.ts atualizado
        run: git diff --exit-code src/routeTree.gen.ts || (echo "::warning::routeTree.gen.ts desatualizado"; git diff src/routeTree.gen.ts)
      - name: Verificação de tipos
        run: bunx tsc --noEmit
      - name: Testes
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Conexão com o Supabase (informativo)
        continue-on-error: true
        run: |
          set -a; . ./.env; set +a
          for t in categories products site_settings; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" "$VITE_SUPABASE_URL/rest/v1/$t?select=*&limit=3" -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
            echo "$t -> HTTP $code"; head -c 400 /tmp/out.json; echo
          done

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações e testar pedidos
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_stubs.sql
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/pedidos_test.sql
